name: safeguard_ai
description: "AI-Powered Safety Automation App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- STATE MANAGEMENT (BLoC) ---
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # --- NAVIGATION (GoRouter) ---
  go_router: ^13.0.0

  # --- NETWORKING (Dio) ---
  dio: ^5.7.0

  # --- LOCAL STORAGE (Hive) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- UTILS ---
  fpdart: ^1.1.0
  geolocator: ^10.1.0
  uuid: ^4.3.3
  intl: ^0.19.0

  # --- UI & DESIGN ---
  google_fonts: ^6.1.0
  lottie: ^3.1.0
  cupertino_icons: ^1.0.8

  # --- CAMERA & HARDWARE ---
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- CODE GENERATION ---
  build_runner: ^2.4.8

  # Freezed & JSON
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

  # Linter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

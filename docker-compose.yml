version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: safeguard_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      # ÖNEMLI: Data burada saklanır, asla kaybolmaz!
      - ./n8n_data:/home/node/.n8n
      # Workflow backup klasörü
      - ./backend_backup:/backup
    networks:
      - safeguard_network

networks:
  safeguard_network:
    driver: bridge

